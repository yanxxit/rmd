name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    branches: [main]

jobs:
  # Required builds: publish depends on all of these succeeding.
  # Windows targets are intentionally excluded (not published yet).
  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: x86_64-apple-darwin
            build: npx --yes napi build --platform --release --target x86_64-apple-darwin --js native.js
          - host: macos-latest
            target: aarch64-apple-darwin
            build: npx --yes napi build --platform --release --target aarch64-apple-darwin --js native.js
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: npx --yes napi build --platform --release --target x86_64-unknown-linux-gnu --js native.js
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            build: |
              export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
              npx --yes napi build --platform --release --target aarch64-unknown-linux-gnu --js native.js
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            build: npx --yes napi build --platform --release --target x86_64-unknown-linux-musl --js native.js
          - host: ubuntu-latest
            target: aarch64-unknown-linux-musl
            build: |
              export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc
              npx --yes napi build --platform --release --target aarch64-unknown-linux-musl --js native.js

    name: build - ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}
      - name: Install cross toolchain (aarch64 linux)
        if: ${{ contains(matrix.settings.target, 'aarch64-unknown-linux') }}
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Install musl tools
        if: ${{ contains(matrix.settings.target, 'musl') }}
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - run: npm install
      - run: ${{ matrix.settings.build }}
      - uses: actions/upload-artifact@v5
        with:
          name: bindings-${{ matrix.settings.target }}
          path: "*.node"
          if-no-files-found: error

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    # Give the default GITHUB_TOKEN permission to create releases / push tags.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: npm
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      # Single step: sync version -> move artifacts -> install -> verify -> publish.
      # Keeping it all in one step removes any ambiguity about file state between
      # steps (npm install cannot roll back the version we just wrote).
      - name: Sync version and publish
        env:
          # Inject VERSION at the step-env level so node subprocesses see it
          # via process.env (a plain shell `VERSION=x` is NOT exported to children).
          VERSION: ${{ github.ref_name }}
        run: |
          # Tag is like "v0.1.3"; derive "0.1.3" and write it everywhere.
          echo "Publishing version: $VERSION"

          # 1) Sync version into package.json + Cargo.toml.
          node -e "
            const fs = require('fs');
            const version = process.env.VERSION.replace(/^v/, '');
            const pkgPath = 'package.json';
            const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
            pkg.version = version;
            for (const k of Object.keys(pkg.optionalDependencies || {})) {
              pkg.optionalDependencies[k] = version;
            }
            // Normalize repository.url without npm pkg fix (which can drop version).
            if (pkg.repository && typeof pkg.repository.url === 'string') {
              let u = pkg.repository.url;
              if (!u.startsWith('git+')) u = 'git+' + u;
              if (!u.endsWith('.git')) u = u + '.git';
              pkg.repository.url = u;
            }
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
            console.log('Updated package.json version to:', pkg.version);
          "
          sed -i.bak "s/^version = .*/version = \"${VERSION#v}\"/" Cargo.toml && rm -f Cargo.toml.bak
          grep '^version' Cargo.toml | head -1
          grep '"version"' package.json | head -1

          # 2) Move build artifacts into place.
          mkdir -p binaries
          for d in artifacts/bindings-*/; do
            cp "$d"*.node binaries/ 2>/dev/null || true
          done
          ls -la binaries

          # 3) Install dependencies (--ignore-scripts keeps package.json untouched).
          npm install --ignore-scripts

          # 4) Re-verify version after install (guards against any tooling reset).
          node -e 'const fs = require("fs"); const pkg = JSON.parse(fs.readFileSync("package.json", "utf8")); const v = pkg.version; if (!/^[0-9]+\.[0-9]+\.[0-9]+$/.test(v)) { console.error("Invalid version in package.json:", v); process.exit(1); } const allOpt = Object.values(pkg.optionalDependencies || {}).every((x) => x === v); console.log("Pre-publish version:", v, "| optionalDeps in sync:", allOpt); if (!allOpt) process.exit(1);'

          # 5) napi v3 prepublish always creates a GitHub Release (no --no-gh-release
          #    flag exists); it needs GITHUB_TOKEN + `contents: write` (declared above).
          #    Use the project-locked @napi-rs/cli (not npx --yes remote fetch).
          npx napi prepublish -t binaries --gh-release --tag-style npm

          # 6) --ignore-scripts guards against any stray lifecycle hooks interfering.
          npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
