name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            build: napi build --platform --release --target x86_64-pc-windows-msvc --js native.js
          - host: windows-latest
            target: aarch64-pc-windows-msvc
            build: napi build --platform --release --target aarch64-pc-windows-msvc --js native.js
          - host: macos-latest
            target: x86_64-apple-darwin
            build: napi build --platform --release --target x86_64-apple-darwin --js native.js
          - host: macos-latest
            target: aarch64-apple-darwin
            build: napi build --platform --release --target aarch64-apple-darwin --js native.js
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: napi build --platform --release --target x86_64-unknown-linux-gnu --js native.js
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            build: |
              export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
              napi build --platform --release --target aarch64-unknown-linux-gnu --js native.js
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            build: napi build --platform --release --target x86_64-unknown-linux-musl --js native.js

    name: build - ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}
      - name: Install cross (aarch64 linux)
        if: ${{ matrix.settings.target == 'aarch64-unknown-linux-gnu' }}
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - run: npm install
      - run: ${{ matrix.settings.build }}
      - uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: "*.node"
          if-no-files-found: error

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Move artifacts
        run: |
          mkdir -p binaries
          for d in artifacts/bindings-*/; do
            cp "$d"*.node binaries/ 2>/dev/null || true
          done
          ls -la binaries
      - name: Build all platform packages & publish
        run: |
          npm install
          npx napi prepublish -t binaries
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
