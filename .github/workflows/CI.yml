name: CI

on:
  push:
    # 本地默认分支是 master，监听它以在 push 时跑构建校验。
    branches: [master, main]
    # 仅匹配 vX.Y.Z 形式的 tag，避免孤儿 tag（如 `v`）误触发发布。
    tags: ["v*"]
  pull_request:
    branches: [master, main]

jobs:
  # Build every platform's prebuilt .node binary.
  # NOTE: Windows targets are currently excluded — the published package does
  # NOT contain win32 binaries, so Windows consumers will fail to load. Either
  # add a windows-latest runner below or document "Windows unsupported".
  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: x86_64-apple-darwin
            build: npx --yes napi build --platform --release --target x86_64-apple-darwin --js native.js
          - host: macos-latest
            target: aarch64-apple-darwin
            build: npx --yes napi build --platform --release --target aarch64-apple-darwin --js native.js
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: npx --yes napi build --platform --release --target x86_64-unknown-linux-gnu --js native.js
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            build: |
              export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
              npx --yes napi build --platform --release --target aarch64-unknown-linux-gnu --js native.js
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            build: npx --yes napi build --platform --release --target x86_64-unknown-linux-musl --js native.js
          - host: ubuntu-latest
            target: aarch64-unknown-linux-musl
            build: |
              export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc
              npx --yes napi build --platform --release --target aarch64-unknown-linux-musl --js native.js
          # Windows cross-compile is not possible from Linux/macOS runners.
          # Uncomment to enable once a Windows build box is available:
          # - host: windows-latest
          #   target: x86_64-pc-windows-msvc
          #   build: npx --yes napi build --platform --release --target x86_64-pc-windows-msvc --js native.js
          # - host: windows-latest
          #   target: aarch64-pc-windows-msvc
          #   build: npx --yes napi build --platform --release --target aarch64-pc-windows-msvc --js native.js

    name: build - ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          # key by target so each platform caches independently
          key: ${{ matrix.settings.target }}
      - name: Install cross toolchain (aarch64 linux)
        if: ${{ contains(matrix.settings.target, 'aarch64-unknown-linux') }}
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Install musl tools
        if: ${{ contains(matrix.settings.target, 'musl') }}
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      # --ignore-scripts avoids accidentally running a prepare/build hook.
      - run: npm install --ignore-scripts
      - run: ${{ matrix.settings.build }}
      - uses: actions/upload-artifact@v5
        with:
          name: bindings-${{ matrix.settings.target }}
          path: "*.node"
          if-no-files-found: error

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: npm
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      # Single step: sync version -> move artifacts -> install -> verify -> publish.
      - name: Sync version and publish
        env:
          VERSION: ${{ github.ref_name }}
          # IMPORTANT: this must be a granular token with "bypass 2fa" enabled,
          # because the npm account enforces 2FA on publish (OTP is NOT accepted).
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "Publishing version: $VERSION"

          # 1) Sync version into package.json + Cargo.toml.
          node -e "
            const fs = require('fs');
            const version = process.env.VERSION.replace(/^v/, '');
            const pkgPath = 'package.json';
            const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
            pkg.version = version;
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
            console.log('Updated package.json version to:', pkg.version);
          "
          sed -i.bak "s/^version = .*/version = \"${VERSION#v}\"/" Cargo.toml && rm -f Cargo.toml.bak
          grep '^version' Cargo.toml | head -1
          grep '"version"' package.json | head -1

          # 2) Move build artifacts into place (index.<platform>.node at repo root).
          mkdir -p binaries
          for d in artifacts/bindings-*/; do
            cp "$d"*.node binaries/ 2>/dev/null || true
          done
          # The main package now ships every .node directly, so copy them to root.
          cp binaries/*.node . 2>/dev/null || true
          ls -la *.node

          # 3) Install dependencies (--ignore-scripts keeps package.json untouched).
          npm install --ignore-scripts

          # 4) Re-verify version after install.
          node -e 'const fs = require("fs"); const pkg = JSON.parse(fs.readFileSync("package.json", "utf8")); const v = pkg.version; if (!/^[0-9]+\.[0-9]+\.[0-9]+$/.test(v)) { console.error("Invalid version in package.json:", v); process.exit(1); } console.log("Pre-publish version:", v);'

          # 5) Publish the single package (all platforms embedded).
          # NOTE: --otp is not supported here; rely on a bypass-2fa NPM_TOKEN.
          npm publish --access public --ignore-scripts
